# Despliegue en Coolify (entorno dev).
#
# `docker-compose.yml` es para levantar el stack en la máquina de un desarrollador.
# Este archivo es para publicarlo: en Coolify se crea un recurso "Docker Compose",
# se apunta a este repositorio y se selecciona este archivo. Las variables van en
# la pestaña Environment Variables del recurso; aquí no se versiona ningún secreto.
#
# La base de datos es Neon (gestionada), igual que en docker-compose.yml: por eso
# este stack NO levanta un Postgres propio. Basta con configurar PG* / DATABASE_URL
# apuntando a Neon.
#
# Uso local:  docker compose -f docker-compose.dev.yml up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify publica el servicio en este FQDN y lo inyecta de vuelta.
      SERVICE_FQDN_API_3000: ${SERVICE_FQDN_API_3000:-}

      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0
      API_PREFIX: api
      # Obligatorio en produccion y sin comodines: son los origenes del frontend.
      CORS_ORIGINS: ${CORS_ORIGINS:?define CORS_ORIGINS con el dominio del frontend}
      # Detras del proxy de Coolify hay exactamente un salto de confianza.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}

      PGHOST: ${PGHOST:?define PGHOST con el host de Neon}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-neondb}
      PGUSER: ${PGUSER:?define PGUSER}
      PGPASSWORD: ${PGPASSWORD:?define PGPASSWORD}
      PGSSLMODE: ${PGSSLMODE:-require}
      DATABASE_URL: ${DATABASE_URL:?define DATABASE_URL}

      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-cpa_session}
      # Sobre HTTPS la cookie debe ser secure; con SameSite=none es obligatorio.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}

      # `redis` es el nombre del servicio y solo resuelve dentro de esta red.
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-cpa:backend}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # Aplica las migraciones y termina. En Coolify aparece como "exited (0)"
  # cuando fue bien: es el comportamiento esperado, no un fallo.
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["node", "scripts/migrate-prod.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PGHOST: ${PGHOST:?define PGHOST con el host de Neon}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-neondb}
      PGUSER: ${PGUSER:?define PGUSER}
      PGPASSWORD: ${PGPASSWORD:?define PGPASSWORD}
      PGSSLMODE: ${PGSSLMODE:-require}
      DATABASE_URL: ${DATABASE_URL:?define DATABASE_URL}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
